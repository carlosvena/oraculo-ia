name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Sin android/key.properties (no está en el repo, es privado) esto
      # compila firmado con la clave debug. Es instalable para probar,
      # pero no para publicar en Google Play — para eso hace falta subir
      # la keystore como GitHub Secret (ver docs/RELEASE_SIGNING.md).
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: oraculo-ia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
